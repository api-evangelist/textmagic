actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or SSE streaming surface exists. Event delivery is via
    user-configured HTTP callback (webhook) URLs, which are not modeled as
    AsyncAPI streaming under current scope, so no AsyncAPI document was
    authored.
