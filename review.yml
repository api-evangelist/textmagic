aid: textmagic
name: Textmagic
review:
  question: Does Textmagic expose a documented public WebSocket or streaming API?
  answer: false
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was created. The Textmagic REST API (v2) is a
    request/response HTTPS interface. There is no documented WebSocket
    (ws:// or wss://) endpoint and no HTTP Server-Sent Events (SSE) stream.
    Inbound and event delivery is push-based via configurable HTTP callback
    (webhook) URLs, which are out of scope for AsyncAPI streaming modeling
    under current API Evangelist scope.
findings:
  summary: |
    Textmagic does not publish a documented public WebSocket or streaming
    API. All documented programmatic access is via the REST API (v2) at
    https://rest.textmagic.com/api/v2, authenticated with the X-TM-Username
    and X-TM-Key headers. Real-time and inbound events (delivered SMS
    statuses, inbound replies) are delivered through user-configured HTTP
    callback URLs (webhooks) managed via /callback/settings, not over a
    persistent socket. No bidirectional or server-push socket transport is
    documented.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://rest.textmagic.com/api/v2
      documented: true
    - protocol: Webhook
      scheme: https
      note: Inbound replies and delivery statuses are POSTed to a user-configured callback URL; not a persistent socket.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the Textmagic API reference as of the review date.
    - protocol: SSE
      scheme: https
      documented: false
      note: No Server-Sent Events stream is documented.
