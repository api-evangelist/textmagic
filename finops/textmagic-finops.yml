  PricingCategory: Usage-Based
meters:
- name: sms_segments
  description: Outbound SMS message segments (160 plain-text characters), billed per segment by destination country.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
  - sender
- name: email_messages
  description: Outbound emails billed per email beyond the free allowance.
  unit: emails
  aggregation: sum
  dimensions:
  - account
- name: virtual_number_months
  description: Recurring monthly subscription for dedicated virtual numbers.
  unit: number_months
  aggregation: sum
  dimensions:
  - account
  - country
- name: campaign_registration_months
  description: Recurring monthly fee for 10DLC campaign registration and alphanumeric sender IDs.
  unit: campaign_months
  aggregation: sum
  dimensions:
  - account
  - campaign
- name: prepaid_credit
  description: Prepaid credit purchased and consumed across services; unused credit is refundable.
  unit: currency
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull spending statistics via /stats/spending and account balance via /user to track credit burn.
- name: Allocation
  description: Tag sends by list, template, and sender to map message spend to campaigns and cost centers.
- name: Optimization
  description: Use a connected CPaaS provider for lower per-SMS rates; batch via bulk sessions; reuse templates; release unused virtual numbers and campaigns.
- name: Accountability
  description: Set balance notification thresholds; review prepaid credit consumption and recurring number/campaign fees monthly against budget.
maintainers:
