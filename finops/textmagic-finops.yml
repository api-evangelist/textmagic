serviceCategory: Communications
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Prepaid
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Textmagic
  ServiceCategory: Communications
  ProviderName: Textmagic
  PublisherName: Textmagic
  InvoiceIssuerName: Textmagic
  BillingCurrency: USD
