description: >-
  FinOps view of Textmagic spend. Textmagic uses a prepaid credit model billed
  per message segment for SMS and per email beyond a free allowance, plus
  recurring monthly fees for dedicated virtual numbers, 10DLC campaign
  registration, and alphanumeric sender IDs. Per-message rates vary by
  destination country and by whether messages are sent through a connected
  CPaaS provider. Unused credit is fully refundable.
notes: >-
  Per-message and per-number rates are subject to change and vary by country;
  verify against the Textmagic pricing page during reconciliation.
sources:
- https://www.textmagic.com/pricing/
- https://docs.textmagic.com/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
